# Web server configuration for the Coolify "Static" build pack.
#
# Paste the contents into the application's "Custom Nginx Configuration" field.
# Coolify does NOT read this file from the repository — it is kept in git so the
# deployed configuration is reviewable.
#
# IMPORTANT: Coolify writes this field to /etc/nginx/conf.d/default.conf, which
# the base image includes from INSIDE the http {} block. It must therefore
# contain a bare server { } block only. An events {} or http {} block here makes
# nginx refuse to start ("events directive is not allowed here") and the
# container crash-loops.
#
# Based on Coolify's "Generate Default Nginx Configuration" output, with the
# changes marked "# CHANGED" / "# ADDED" below. Verified against nginx:alpine
# with this file mounted at /etc/nginx/conf.d/default.conf.

server {
    listen 80;

    # CHANGED: root and index moved from `location /` to server level. Coolify's
    # default declares them only inside `location /`, so any additional location
    # block (the two below) would fall back to the compiled-in default root and
    # return 404 for every asset it matches.
    root  /usr/share/nginx/html;
    index index.html index.htm;

    # ADDED: emit relative redirects. Coolify terminates TLS at its proxy and
    # forwards plain HTTP; without this, nginx's trailing-slash redirect would
    # send an absolute "http://..." Location and drop the client off HTTPS.
    absolute_redirect off;

    # ADDED: keep this staging copy out of search indexes. It previews content
    # destined for ihreapotheken.de, and robots.txt in this repo is the
    # *production* file (it allows crawling and points its sitemap at the live
    # domain), so this header is what actually prevents the prototype from
    # competing with production for the same queries. Remove only if this host
    # is deliberately meant to be indexed.
    #
    # nginx's add_header is not additive: a location block that sets any
    # add_header stops inheriting the server-level ones. That is why the header
    # is repeated in both location blocks below.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ADDED: do not advertise the nginx patch version.
    server_tokens off;

    # ADDED: compression.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml;

    location / {
        # CHANGED: dropped `$uri/index.html $uri/index.htm` from Coolify's
        # default. They matched before `$uri/`, so /ratgeber was answered with
        # the page body directly instead of redirecting to /ratgeber/. The
        # browser then resolved the page's relative references (./support.js,
        # uploads/...) against / and got 404s — the page did not render at all.
        # Leaving only `$uri/` restores the 301 to the canonical trailing-slash
        # URL.
        try_files $uri $uri.html $uri/ =404;
    }

    # ADDED: long cache for images and fonts.
    location ~* \.(png|jpe?g|gif|svg|woff2?|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Robots-Tag  "noindex, nofollow" always;
    }

    # ADDED: HTML and the dc-runtime must revalidate, so content edits go live
    # on the next request instead of after a browser cache expiry.
    location ~* \.(html|js|txt)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag  "noindex, nofollow" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
