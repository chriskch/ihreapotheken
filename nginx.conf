# Reference nginx configuration for the Coolify "Static" build pack.
#
# IMPORTANT: Coolify does NOT read this file from the repository. It stores the
# web server configuration in the UI (Application -> Configuration -> click
# "Generate" next to the nginx configuration field). This file is the source of
# truth for what to paste there, kept in git so the deployed config is
# reviewable.
#
# Safest workflow: click "Generate" in Coolify first to get the default config
# for your Coolify version, then merge in the marked blocks below. If the
# generated default matches this file's shape, you can paste this wholesale.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;

    # ---- added: compression -------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml;
    # ------------------------------------------------------------------------

    server {
        listen      80;
        listen      [::]:80;
        server_name localhost;

        root  /usr/share/nginx/html;
        index index.html;

        # ---- added: emit relative redirects ---------------------------------
        # Coolify terminates TLS at its proxy and forwards plain HTTP. Without
        # this, nginx's directory redirect (/ratgeber -> /ratgeber/) would send
        # an absolute "http://..." Location and cost an extra HTTPS hop.
        absolute_redirect off;
        # --------------------------------------------------------------------

        # ---- added: keep the staging copy out of search indexes ------------
        # This is a preview of content destined for ihreapotheken.de. Without
        # this header the prototype competes with production for the same
        # queries (duplicate content). Remove ONLY if this domain is ever meant
        # to be indexed. Note: robots.txt in this repo is the *production*
        # file and allows crawling, so the header is what actually protects us.
        add_header X-Robots-Tag "noindex, nofollow" always;
        # --------------------------------------------------------------------

        location / {
            try_files $uri $uri.html $uri/ =404;
        }

        # ---- added: long cache for immutable-ish assets ---------------------
        location ~* \.(png|jpe?g|gif|svg|woff2?|ico)$ {
            add_header Cache-Control "public, max-age=2592000";
            add_header X-Robots-Tag  "noindex, nofollow" always;
        }

        # HTML and the dc-runtime must always revalidate so content edits go
        # live on the next request instead of after a browser cache expiry.
        location ~* \.(html|js|txt)$ {
            add_header Cache-Control "no-cache, must-revalidate";
            add_header X-Robots-Tag  "noindex, nofollow" always;
        }
        # --------------------------------------------------------------------

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
